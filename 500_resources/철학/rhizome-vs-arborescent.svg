<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-label="수목 구조와 리좀 구조 비교">
  <defs>
    <style>
      .frame { fill: none; stroke: #d8d8d2; stroke-width: 1.5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif; font-size: 16px; font-weight: 600; fill: #2a2a2a; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif; font-size: 12px; fill: #4a4a4a; }
      .node-tree { fill: #e8d9c0; stroke: #b59668; stroke-width: 1.5; }
      .node-rhi { fill: #cfd8d3; stroke: #6e8b80; stroke-width: 1.5; }
      .edge-tree { stroke: #b59668; stroke-width: 1.5; fill: none; }
      .edge-rhi { stroke: #6e8b80; stroke-width: 1.5; fill: none; }
      .caption { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif; font-size: 12px; fill: #6a6a6a; font-style: italic; }
    </style>
  </defs>

  <!-- left frame: arborescent -->
  <rect class="frame" x="30" y="40" width="340" height="380" rx="6"/>
  <text class="title" x="200" y="68" text-anchor="middle">수목 (Arborescent)</text>

  <!-- arborescent tree -->
  <line class="edge-tree" x1="200" y1="100" x2="120" y2="170"/>
  <line class="edge-tree" x1="200" y1="100" x2="280" y2="170"/>
  <line class="edge-tree" x1="120" y1="170" x2="80" y2="240"/>
  <line class="edge-tree" x1="120" y1="170" x2="160" y2="240"/>
  <line class="edge-tree" x1="280" y1="170" x2="240" y2="240"/>
  <line class="edge-tree" x1="280" y1="170" x2="320" y2="240"/>
  <line class="edge-tree" x1="80" y1="240" x2="60" y2="310"/>
  <line class="edge-tree" x1="80" y1="240" x2="100" y2="310"/>
  <line class="edge-tree" x1="160" y1="240" x2="140" y2="310"/>
  <line class="edge-tree" x1="160" y1="240" x2="180" y2="310"/>
  <line class="edge-tree" x1="240" y1="240" x2="220" y2="310"/>
  <line class="edge-tree" x1="240" y1="240" x2="260" y2="310"/>
  <line class="edge-tree" x1="320" y1="240" x2="300" y2="310"/>
  <line class="edge-tree" x1="320" y1="240" x2="340" y2="310"/>

  <circle class="node-tree" cx="200" cy="100" r="14"/>
  <circle class="node-tree" cx="120" cy="170" r="11"/>
  <circle class="node-tree" cx="280" cy="170" r="11"/>
  <circle class="node-tree" cx="80" cy="240" r="9"/>
  <circle class="node-tree" cx="160" cy="240" r="9"/>
  <circle class="node-tree" cx="240" cy="240" r="9"/>
  <circle class="node-tree" cx="320" cy="240" r="9"/>
  <circle class="node-tree" cx="60" cy="310" r="7"/>
  <circle class="node-tree" cx="100" cy="310" r="7"/>
  <circle class="node-tree" cx="140" cy="310" r="7"/>
  <circle class="node-tree" cx="180" cy="310" r="7"/>
  <circle class="node-tree" cx="220" cy="310" r="7"/>
  <circle class="node-tree" cx="260" cy="310" r="7"/>
  <circle class="node-tree" cx="300" cy="310" r="7"/>
  <circle class="node-tree" cx="340" cy="310" r="7"/>

  <text class="label" x="220" y="104">뿌리</text>
  <text class="caption" x="200" y="380" text-anchor="middle">하나의 뿌리 → 위계적 분기 → 단일 경로</text>

  <!-- right frame: rhizome -->
  <rect class="frame" x="430" y="40" width="340" height="380" rx="6"/>
  <text class="title" x="600" y="68" text-anchor="middle">리좀 (Rhizome)</text>

  <!-- rhizome edges (no hierarchy) -->
  <line class="edge-rhi" x1="490" y1="130" x2="600" y2="160"/>
  <line class="edge-rhi" x1="490" y1="130" x2="540" y2="240"/>
  <line class="edge-rhi" x1="600" y1="160" x2="710" y2="140"/>
  <line class="edge-rhi" x1="600" y1="160" x2="640" y2="260"/>
  <line class="edge-rhi" x1="540" y1="240" x2="640" y2="260"/>
  <line class="edge-rhi" x1="540" y1="240" x2="480" y2="330"/>
  <line class="edge-rhi" x1="640" y1="260" x2="720" y2="320"/>
  <line class="edge-rhi" x1="710" y1="140" x2="720" y2="240"/>
  <line class="edge-rhi" x1="720" y1="240" x2="640" y2="260"/>
  <line class="edge-rhi" x1="480" y1="330" x2="580" y2="360"/>
  <line class="edge-rhi" x1="580" y1="360" x2="720" y2="320"/>
  <line class="edge-rhi" x1="490" y1="130" x2="710" y2="140"/>
  <line class="edge-rhi" x1="540" y1="240" x2="710" y2="140"/>
  <line class="edge-rhi" x1="580" y1="360" x2="640" y2="260"/>

  <circle class="node-rhi" cx="490" cy="130" r="10"/>
  <circle class="node-rhi" cx="600" cy="160" r="10"/>
  <circle class="node-rhi" cx="710" cy="140" r="10"/>
  <circle class="node-rhi" cx="540" cy="240" r="10"/>
  <circle class="node-rhi" cx="640" cy="260" r="10"/>
  <circle class="node-rhi" cx="720" cy="240" r="10"/>
  <circle class="node-rhi" cx="480" cy="330" r="10"/>
  <circle class="node-rhi" cx="580" cy="360" r="10"/>
  <circle class="node-rhi" cx="720" cy="320" r="10"/>

  <text class="caption" x="600" y="400" text-anchor="middle">중심 없음 → 어느 점이든 어느 점과 연결 → 입구가 여럿</text>
</svg>
