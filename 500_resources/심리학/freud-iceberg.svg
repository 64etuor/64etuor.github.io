<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" role="img" aria-label="프로이트의 빙산 비유 — 의식, 전의식, 무의식의 비대칭 구조">
	<defs>
		<style>
			.label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif; fill: #1f2a37; }
			.label-main { font-size: 18px; font-weight: 600; }
			.label-sub { font-size: 13px; fill: #4b5563; }
			.label-light { font-size: 18px; font-weight: 600; fill: #f8fafc; }
			.label-light-sub { font-size: 13px; fill: #e2e8f0; }
			.water-line { stroke: #0f766e; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
			.water-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif; font-size: 11px; fill: #0f766e; letter-spacing: 0.5px; }
			.sky { fill: #f1f5f9; }
			.sea { fill: #cbe5e3; fill-opacity: 0.55; }
			.ice-conscious { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
			.ice-preconscious { fill: #7aa6c4; stroke: #4b6e88; stroke-width: 1.5; }
			.ice-unconscious { fill: #1e3a52; stroke: #0f1f31; stroke-width: 1.5; }
			.tick { stroke: #94a3b8; stroke-width: 1; }
			.tick-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif; font-size: 11px; fill: #64748b; }
		</style>
	</defs>

	<!-- background bands -->
	<rect class="sky" x="0" y="0" width="600" height="180"/>
	<rect class="sea" x="0" y="180" width="600" height="540"/>

	<!-- water line -->
	<line class="water-line" x1="20" y1="180" x2="580" y2="180"/>
	<text class="water-label" x="30" y="174">수면 (Surface of Awareness)</text>

	<!-- iceberg: above water (conscious) — small, asymmetric peak -->
	<polygon class="ice-conscious"
		points="262,180 280,120 296,90 312,70 326,95 342,130 354,160 362,180"/>

	<!-- iceberg: just below water (preconscious) — wider band -->
	<polygon class="ice-preconscious"
		points="262,180 362,180 392,228 410,268 396,300 248,300 226,268 240,228"/>

	<!-- iceberg: deep underwater (unconscious) — huge asymmetric mass -->
	<polygon class="ice-unconscious"
		points="248,300 396,300 448,360 478,432 488,498 470,560 432,612 380,650 312,672 244,664 180,628 138,572 122,508 130,436 168,372"/>

	<!-- region labels -->
	<text class="label label-main" x="384" y="108">의식</text>
	<text class="label label-sub" x="384" y="126">Conscious  ~10%</text>
	<line class="tick" x1="378" y1="115" x2="332" y2="115"/>

	<text class="label label-main" x="430" y="248">전의식</text>
	<text class="label label-sub" x="430" y="266">Preconscious  ~15%</text>
	<line class="tick" x1="424" y1="255" x2="402" y2="255"/>

	<text class="label-light label-light" x="252" y="492" text-anchor="middle">무의식</text>
	<text class="label-light label-light-sub" x="252" y="512" text-anchor="middle">Unconscious  ~75%</text>

	<!-- proportion gauge on the right -->
	<g transform="translate(548,80)">
		<rect x="0" y="0" width="14" height="60" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
		<rect x="0" y="60" width="14" height="90" fill="#7aa6c4" stroke="#4b6e88" stroke-width="1"/>
		<rect x="0" y="150" width="14" height="450" fill="#1e3a52" stroke="#0f1f31" stroke-width="1"/>
		<text class="tick-label" x="20" y="34">10</text>
		<text class="tick-label" x="20" y="110">15</text>
		<text class="tick-label" x="20" y="380">75 (%)</text>
	</g>
</svg>
