<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-label="Ontology abstraction layers from upper to application as an inverted pyramid">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif; fill: #1f2937; }
      .layer-title { font-size: 17px; font-weight: 600; fill: #0f172a; }
      .layer-sub { font-size: 12.5px; fill: #475569; }
      .axis-label { font-size: 12.5px; fill: #64748b; letter-spacing: 0.5px; }
      .axis-head { font-size: 13px; font-weight: 600; fill: #334155; }
      .example { font-size: 12px; fill: #334155; }
      .stroke-default { stroke: #475569; stroke-width: 1.5; fill: none; }
      .stroke-emphasis { stroke: #0f172a; stroke-width: 2.5; fill: none; }
      .fill-upper { fill: #e0e7ff; stroke: #6366f1; stroke-width: 1.5; }
      .fill-domain { fill: #fce7f3; stroke: #db2777; stroke-width: 1.5; }
      .fill-app { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .align-arrow { stroke: #475569; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 8 L 5 0 L 10 8 z" fill="#475569"/>
    </marker>
    <marker id="axisArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Left axis: Abstract (top) -> Concrete (bottom) -->
  <text class="label axis-head" x="48" y="62" text-anchor="middle">추상</text>
  <text class="label axis-label" x="48" y="80" text-anchor="middle">Abstract</text>
  <line x1="48" y1="100" x2="48" y2="470" stroke="#64748b" stroke-width="1.5" marker-end="url(#axisArrow)"/>
  <text class="label axis-head" x="48" y="500" text-anchor="middle">구체</text>
  <text class="label axis-label" x="48" y="518" text-anchor="middle">Concrete</text>

  <!-- Upper Ontology layer (widest, top) -->
  <polygon class="fill-upper" points="100,90 620,90 560,200 160,200"/>
  <text class="label layer-title" x="360" y="135" text-anchor="middle">Upper Ontology</text>
  <text class="label layer-sub" x="360" y="156" text-anchor="middle">상위 온톨로지 · domain-independent</text>
  <text class="label layer-sub" x="360" y="180" text-anchor="middle" font-style="italic">가장 넓고 추상적</text>

  <!-- Domain Ontology layer (middle) -->
  <polygon class="fill-domain" points="160,215 560,215 500,325 220,325"/>
  <text class="label layer-title" x="360" y="260" text-anchor="middle">Domain Ontology</text>
  <text class="label layer-sub" x="360" y="281" text-anchor="middle">도메인 온톨로지 · 특정 영역</text>
  <text class="label layer-sub" x="360" y="305" text-anchor="middle" font-style="italic">상위에 정렬</text>

  <!-- Application Ontology layer (narrowest, bottom) -->
  <polygon class="fill-app" points="220,340 500,340 440,450 280,450"/>
  <text class="label layer-title" x="360" y="380" text-anchor="middle">Application Ontology</text>
  <text class="label layer-sub" x="360" y="401" text-anchor="middle">응용 온톨로지 · 단일 시스템</text>
  <text class="label layer-sub" x="360" y="425" text-anchor="middle" font-style="italic">가장 좁고 구체</text>

  <!-- Alignment arrows: application aligns to domain, domain aligns to upper -->
  <path class="align-arrow" d="M 145 332 Q 110 270 145 208" marker-end="url(#arrowUp)"/>
  <text class="label axis-label" x="92" y="275" text-anchor="middle">정렬</text>
  <text class="label axis-label" x="92" y="292" text-anchor="middle">aligns</text>

  <path class="align-arrow" d="M 205 442 Q 175 385 205 333" marker-end="url(#arrowUp)"/>
  <text class="label axis-label" x="152" y="395" text-anchor="middle">정렬</text>

  <!-- Right side: example labels per layer -->
  <line x1="585" y1="145" x2="640" y2="145" class="stroke-default"/>
  <text class="label example" x="650" y="138">BFO</text>
  <text class="label example" x="650" y="155">DOLCE · SUMO</text>

  <line x1="525" y1="270" x2="640" y2="270" class="stroke-default"/>
  <text class="label example" x="650" y="263">SNOMED CT (의료)</text>
  <text class="label example" x="650" y="280">Gene Ontology (생물)</text>
  <text class="label example" x="650" y="297">FIBO (금융)</text>

  <line x1="465" y1="395" x2="640" y2="395" class="stroke-default"/>
  <text class="label example" x="650" y="388">단일 앱 스키마</text>
  <text class="label example" x="650" y="405">시스템 전용 KB</text>

  <!-- Bottom hint: width = scope of applicability -->
  <text class="label axis-label" x="360" y="495" text-anchor="middle">너비 = 적용 범위 (위로 갈수록 넓음)</text>
  <text class="label axis-label" x="360" y="513" text-anchor="middle">width = scope of applicability</text>
</svg>
