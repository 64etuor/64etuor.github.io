<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-label="Threat quadrant matrix comparing Karpathy llmwiki spec and this vault across time and rot type">
  <defs>
    <style>
      .axis { stroke: #555; stroke-width: 1.5; fill: none; }
      .axis-arrow { fill: #555; }
      .grid { stroke: #d8d8d8; stroke-width: 1; fill: none; stroke-dasharray: 3 4; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif; font-size: 13px; fill: #222; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif; font-size: 13px; fill: #444; font-weight: 600; }
      .axis-tick { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif; font-size: 11px; fill: #666; }
      .quad-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif; font-size: 11px; fill: #888; font-style: italic; }
      .marker-karpathy { fill: #c2410c; fill-opacity: 0.18; stroke: #c2410c; stroke-width: 2; }
      .marker-vault { fill: #1d4ed8; fill-opacity: 0.18; stroke: #1d4ed8; stroke-width: 2; }
      .marker-label-k { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif; font-size: 13px; fill: #9a3412; font-weight: 600; }
      .marker-label-v { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif; font-size: 13px; fill: #1e40af; font-weight: 600; }
      .force { stroke: #6b7280; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
      .force-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif; font-size: 11px; fill: #6b7280; font-style: italic; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif; font-size: 12px; fill: #333; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="axis-arrow"/>
    </marker>
    <marker id="force-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Plot area: x 100..640, y 80..460 -->
  <!-- Grid lines -->
  <line class="grid" x1="100" y1="270" x2="640" y2="270"/>
  <line class="grid" x1="370" y1="80" x2="370" y2="460"/>

  <!-- Axes -->
  <line class="axis" x1="100" y1="460" x2="650" y2="460" marker-end="url(#arrow)"/>
  <line class="axis" x1="100" y1="460" x2="100" y2="70"  marker-end="url(#arrow)"/>

  <!-- Axis tick labels -->
  <text class="axis-tick" x="100" y="478" text-anchor="middle">t = 0</text>
  <text class="axis-tick" x="100" y="492" text-anchor="middle">(시작 시점)</text>
  <text class="axis-tick" x="640" y="478" text-anchor="middle">t = ∞</text>
  <text class="axis-tick" x="640" y="492" text-anchor="middle">(6개월+ 후)</text>

  <!-- Axis titles -->
  <text class="axis-label" x="370" y="525" text-anchor="middle">시간 경과 →</text>
  <text class="axis-label" x="55" y="270" text-anchor="middle" transform="rotate(-90 55 270)">부패 유형</text>

  <!-- Y axis tick labels -->
  <text class="axis-tick" x="92" y="170" text-anchor="end">구조적</text>
  <text class="axis-tick" x="92" y="184" text-anchor="end">(필드/링크)</text>
  <text class="axis-tick" x="92" y="370" text-anchor="end">행동적</text>
  <text class="axis-tick" x="92" y="384" text-anchor="end">(읽히지 않음)</text>

  <!-- Quadrant annotations -->
  <text class="quad-note" x="235" y="100" text-anchor="middle">lint catches</text>
  <text class="quad-note" x="505" y="100" text-anchor="middle">drift if uncaught</text>
  <text class="quad-note" x="235" y="450" text-anchor="middle">no notes yet to die</text>
  <text class="quad-note" x="505" y="450" text-anchor="middle">사문화 드리프트</text>

  <!-- Karpathy spec marker: spans right half, both top and bottom (high exposure to t=∞ both rot types) -->
  <rect class="marker-karpathy" x="430" y="120" width="190" height="320" rx="14" ry="14"/>
  <text class="marker-label-k" x="525" y="155" text-anchor="middle">카파시 spec</text>
  <text class="marker-label-k" x="525" y="172" text-anchor="middle" font-size="11" font-weight="400">(minimalist)</text>

  <!-- Vault marker: low t=∞ structural, medium t=∞ behavioral -->
  <!-- Place as a smaller ellipse straddling structural-low and behavioral-medium (right-leaning, vertically centered low) -->
  <ellipse class="marker-vault" cx="500" cy="345" rx="95" ry="60"/>
  <text class="marker-label-v" x="500" y="342" text-anchor="middle">본 볼트</text>
  <text class="marker-label-v" x="500" y="359" text-anchor="middle" font-size="11" font-weight="400">(lint + telemetry)</text>

  <!-- Force vector: Schema Bloat pulling the vault rightward -->
  <path class="force" d="M 405 345 Q 440 345 470 345" marker-end="url(#force-arrow)"/>
  <text class="force-label" x="365" y="338" text-anchor="end">Schema</text>
  <text class="force-label" x="365" y="352" text-anchor="end">Bloat →</text>

  <!-- Legend -->
  <g transform="translate(110, 545)">
    <rect x="0" y="-10" width="14" height="10" class="marker-karpathy"/>
    <text class="legend-text" x="20" y="-1">카파시 spec</text>
    <rect x="130" y="-10" width="14" height="10" class="marker-vault"/>
    <text class="legend-text" x="150" y="-1">본 볼트</text>
    <line x1="240" y1="-5" x2="265" y2="-5" class="force" marker-end="url(#force-arrow)"/>
    <text class="legend-text" x="270" y="-1">감수 비용</text>
  </g>
</svg>
