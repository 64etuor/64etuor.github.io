<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="100" y1="400" x2="640" y2="400" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="400" x2="100" y2="40"  stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Axis labels -->
  <text x="370" y="430" text-anchor="middle" font-size="12" fill="#444441">고객 수 · 빈도</text>
  <text x="60"  y="220" text-anchor="middle" font-size="12" fill="#444441" transform="rotate(-90 60 220)">건당 거래 규모</text>

  <!-- Channel 1: Complex Sales (top-left, biggest deal size, fewest customers) -->
  <rect x="130" y="60" width="200" height="56" rx="8"
        fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="230" y="80" text-anchor="middle" dominant-baseline="central"
        font-size="14" font-weight="500" fill="#085041">Complex sales</text>
  <text x="230" y="100" text-anchor="middle" dominant-baseline="central"
        font-size="12" fill="#0F6E56">$10M+ · CEO 직접</text>

  <!-- Channel 2: Personal Sales -->
  <rect x="220" y="140" width="200" height="56" rx="8"
        fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="320" y="160" text-anchor="middle" dominant-baseline="central"
        font-size="14" font-weight="500" fill="#0C447C">Personal sales</text>
  <text x="320" y="180" text-anchor="middle" dominant-baseline="central"
        font-size="12" fill="#185FA5">$10K – $100K · 세일즈팀</text>

  <!-- Dead zone (small narrow bridge between Personal and Marketing) -->
  <rect x="320" y="220" width="60" height="56" rx="8"
        fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="350" y="240" text-anchor="middle" dominant-baseline="central"
        font-size="12" fill="#444441">Dead</text>
  <text x="350" y="258" text-anchor="middle" dominant-baseline="central"
        font-size="12" fill="#444441">zone</text>

  <!-- Channel 3: Marketing -->
  <rect x="380" y="220" width="200" height="56" rx="8"
        fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="480" y="240" text-anchor="middle" dominant-baseline="central"
        font-size="14" font-weight="500" fill="#633806">Marketing</text>
  <text x="480" y="260" text-anchor="middle" dominant-baseline="central"
        font-size="12" fill="#854F0B">$100 – $1,000 · 광고</text>

  <!-- Channel 4: Viral -->
  <rect x="430" y="300" width="200" height="56" rx="8"
        fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="530" y="320" text-anchor="middle" dominant-baseline="central"
        font-size="14" font-weight="500" fill="#72243E">Viral marketing</text>
  <text x="530" y="340" text-anchor="middle" dominant-baseline="central"
        font-size="12" fill="#993556">~$100 · 친구가 친구를</text>
</svg>
