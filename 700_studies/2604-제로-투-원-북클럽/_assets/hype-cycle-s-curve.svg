<svg width="100%" viewBox="0 0 720 510" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="80" y1="400" x2="690" y2="400" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="80" y1="400" x2="80"  y2="40"  stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Axis labels -->
  <text x="385" y="430" text-anchor="middle" font-size="12" fill="#444441">시간</text>
  <text x="40"  y="220" text-anchor="middle" font-size="12" fill="#444441" transform="rotate(-90 40 220)">기대 · 성과</text>

  <!-- Hype Cycle curve (light, behind) -->
  <path d="M80 360
           C 130 360, 160 80, 220 80
           C 270 80, 290 360, 360 370
           C 420 378, 460 320, 520 250
           C 580 190, 620 170, 690 165"
        fill="none" stroke="#C9A227" stroke-width="2.2" stroke-dasharray="6 4" opacity="0.85"/>

  <!-- Hype Cycle stage markers -->
  <circle cx="220" cy="80"  r="4" fill="#C9A227"/>
  <text   x="220" y="64"  text-anchor="middle" font-size="11" fill="#8A6F12">기대의 정점</text>

  <circle cx="360" cy="370" r="4" fill="#C9A227"/>
  <text   x="360" y="392" text-anchor="middle" font-size="11" fill="#8A6F12">환멸의 골짜기</text>

  <circle cx="520" cy="250" r="4" fill="#C9A227"/>
  <text   x="520" y="234" text-anchor="middle" font-size="11" fill="#8A6F12">깨달음의 경사</text>

  <circle cx="660" cy="167" r="4" fill="#C9A227"/>
  <text   x="660" y="151" text-anchor="middle" font-size="11" fill="#8A6F12">생산성의 고원</text>

  <!-- S-curve (foreground, overlaid) — plateaus before the right edge -->
  <path d="M80 380
           C 180 380, 230 380, 290 360
           C 340 343, 360 230, 400 170
           C 440 110, 480 100, 540 100"
        fill="none" stroke="#0F6E56" stroke-width="3"/>

  <!-- S-curve stage labels -->
  <text x="180" y="370" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">도입기</text>
  <text x="350" y="280" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">성장기</text>
  <text x="500" y="92"  text-anchor="middle" font-size="12" font-weight="500" fill="#085041">성숙기</text>

  <!-- Hand-off marker (where the next S-curve takes over, slightly below the plateau) -->
  <circle cx="520" cy="120" r="5" fill="#185FA5"/>
  <text   x="510" y="142" text-anchor="end" font-size="11" fill="#0C447C">인계점</text>

  <!-- Next S-curve (dotted) — starts slightly below the end of the first curve and rises higher -->
  <path d="M520 120
           C 580 120, 600 120, 620 110
           C 645 95, 665 65, 690 55"
        fill="none" stroke="#185FA5" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="660" y="78" text-anchor="middle" font-size="11" fill="#0C447C">다음 S커브</text>

  <!-- Legend (placed below x-axis to avoid overlap with curves and labels) -->
  <g transform="translate(80, 460)">
    <line x1="0" y1="6" x2="24" y2="6" stroke="#C9A227" stroke-width="2.2" stroke-dasharray="6 4"/>
    <text x="30" y="10" font-size="11" fill="#8A6F12">가트너 하이프 사이클</text>

    <line x1="190" y1="6" x2="214" y2="6" stroke="#0F6E56" stroke-width="3"/>
    <text x="220" y="10" font-size="11" fill="#085041">S커브</text>

    <line x1="290" y1="6" x2="314" y2="6" stroke="#185FA5" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="320" y="10" font-size="11" fill="#0C447C">변곡점에서 시작하는 다음 S커브</text>
  </g>
</svg>
